PersonMatting="Person Matting (RVM)"
Model="Model"
Model.Fast="Standard (lighter, less accurate)"
Model.Accurate="High accuracy (recommended)"
Model.Description="High accuracy gives the cleanest cutout and suits most Macs. Standard uses less power, but hair and fingers are less exact."
ComputeUnits="Run on"
ComputeUnits.GPU="Graphics chip"
ComputeUnits.NeuralEngine="Neural Engine (recommended)"
ComputeUnits.All="Automatic"
ComputeUnits.Description="Chooses which part of your Mac makes the cutout. The Neural Engine leaves the graphics chip free for OBS and games. Automatic lets macOS decide."
AlphaLow="Hide faint edges below"
AlphaLow.Description="Makes the faintest parts of the cutout fully transparent. Raise it if a haze or halo shows around you. Lower it if thin hair disappears."
AlphaHigh="Make solid above"
AlphaHigh.Description="Makes the strongest parts of the cutout fully solid. Lower it if parts of you look see-through. Raise it for softer edges."
EdgeStability="Steady edges"
EdgeStability.Description="Holds the cutout steady where the camera picture is still, so the edges stop flickering. Where you move, the cutout follows at once. Set it to 0 to turn the steadying off."
SyncVideo="Line up cutout with video"
SyncVideo.Description="Holds each camera frame until its own cutout is ready, so moving hands and objects are cut out where they are, not where they were. This delays the video by about one frame, and frames are dropped if your Mac cannot keep up."
UsePlate="Use empty-background photo"
UsePlate.Description="Uses a photo of your empty room to remove what the cutout missed, including thin gaps such as the space between headphones and your head. It works best when the camera, the lighting and the furniture stay as they were in the photo. Turn it off if it cuts into you."
CapturePlate="Capture empty background (in 5 seconds)"
CapturePlate.Description="Takes the photo for the option above and turns that option on. Click it and step out of view. The button counts down with a tick each second. Stay out of view until you hear the chime."
CapturePlateCountdown="Step out of view, capturing in"
CapturePlateRunning="Capturing, stay out of view"
CapturePlateFailed="Capture failed, click to try again"
ForgetPlate="Forget background photo"
ForgetPlate.Description="Deletes the saved photo and cancels a countdown. Use empty-background photo then does nothing until you take a new photo."
AutoColor="Automatic color"
AutoColor.Description="Corrects brightness and white balance by itself as the light changes. Brightness follows the brightest parts of the room, and white balance gently follows plain walls, so your skin keeps its own tone. Turn off any Color Correction filter on this camera while this is on."

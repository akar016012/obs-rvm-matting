Model.Fast="Standard (lighter, less accurate)"
Model.Accurate="High accuracy (recommended)"
ComputeUnits="Run on"
ComputeUnits.GPU="Graphics chip"
ComputeUnits.NeuralEngine="Neural Engine (recommended)"
ComputeUnits.All="Automatic"
AlphaLow="Hide faint edges below"
AlphaHigh="Make solid above"
EdgeStability="Steady edges"
EdgeStability.Description="Holds the cutout steady where the camera picture is still, so the edges stop flickering. Where you move, the cutout follows at once. Set it to 0 to turn the steadying off."
SyncVideo="Line up cutout with video"
SyncVideo.Description="Holds each camera frame until its own cutout is ready, so moving hands and objects are cut out where they are, not where they were. This delays the video by about one frame."
UsePlate="Use empty-background photo"
UsePlate.Description="Cuts out anything that matches a photo of your empty room, such as a chair the model mistakes for you. The middle of your body is never cut, even where your clothes match the room."
CapturePlate="Capture empty background (in 5 seconds)"
ForgetPlate="Forget background photo"
RemoveChair="Remove my red chair"
RemoveChair.Description="Always cuts out a red or magenta chair behind you, such as a mesh headrest, even where the model thinks it belongs to you. The middle of your body is never cut."
AutoColor="Automatic color"
AutoColor.Description="Corrects brightness and white balance by itself as the light changes. Brightness follows the brightest parts of the room and white balance follows plain walls, so your skin keeps its own tone. Turn off any Color Correction filter on this camera while this is on."
